version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Sans ceci, la version de Node epinglee dans le Dockerfile se perime en
  # silence et cesse de recevoir les correctifs de securite. Epingler sans
  # mecanisme de montee ne fait que deplacer le probleme.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
