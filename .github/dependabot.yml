version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Sans ceci, la version de Node epinglee dans le Dockerfile se perime en
  # silence et cesse de recevoir les correctifs de securite. Epingler sans
  # mecanisme de montee ne fait que deplacer le probleme.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
    # Un saut de version MAJEURE de Node est une decision d'architecture, pas
    # une mise a jour de routine : il change les API, parfois les contrats
    # (c'est un changement de ce genre qui a casse les envois sortants le
    # 2026-08-24). On veut les correctifs de securite, pas la version suivante
    # imposee par une PR automatique. La montee majeure reste possible — a la
    # main, quand on la decide.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
